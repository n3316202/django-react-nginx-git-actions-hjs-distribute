name: Django EC2 Deploy

on:
  push:
    branches:
      - dev_2_템플릿기반_github_actions_간단배포-2025-05-31
jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest   
    
    steps:
      # actions/checkout@v3: 소스코드를 runner에 내려받습니다.
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create remote directory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo rm -rf /home/ubuntu/django-react-nginx-github-actions-hjs-distribute
            mkdir -p /home/ubuntu/django-react-nginx-github-actions-hjs-distribute
      
      #주로 **로컬 코드(깃허브 저장소)**를 원격 서버(예: EC2)에 rsync 명령어를 통해 빠르게 복사/배포    
      - name: Rsync source code to EC2
        uses: burnett01/rsync-deployments@4.1
        with:
          switches: -avzr --delete
          remote_path: /home/ubuntu/django-react-nginx-github-actions-hjs-distribute/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_KEY }}
      
      - name: Run Docker Compose on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/django-react-nginx-github-actions-hjs-distribute/backend/
            
            # 1. 시스템 업데이트 및 파이썬 설치
            sudo apt update
            sudo apt install -y python3 python3-pip python3-venv

            # 2. 가상환경 생성 (없을 경우만)
            if [ ! -d "venv" ]; then
                python3 -m venv venv
            fi

            # 3. 가상환경 활성화
            source venv/bin/activate

            # 4. Django 등 requirements 설치
            pip install --upgrade pip
            sudo -rf requirements.txt
            pip list --format=freeze > requirements.txt            
            pip install -r requirements.txt

            # 5. 마이그레이션 수행
            python manage.py makemigrations --no-input
            python manage.py migrate --no-input

           
            # 6. 서버 실행 (백그라운드 실행)
            sudo lsof -t -i tcp:8080 | xargs kill -9
            nohup python manage.py runserver 0.0.0.0:8080 > server.log 2>&1 &
   