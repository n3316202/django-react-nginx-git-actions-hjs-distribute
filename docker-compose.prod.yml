#       - frontend

  frontend:
    build:
      context: .         # Dockerfile 기준이 되는 폴더
      dockerfile: frontend/Dockerfile      # frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - static:/home/app/web/static
      - media:/home/app/web/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    #restart: always

volumes:
    static:
    media:
    db-data:
